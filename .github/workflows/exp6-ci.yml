
name: CI - Experiment 6

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display the text file
        run: cat message.txt

      - name: Check file contains expected text
        run: grep "Hello from CI/CD lab" message.txt

